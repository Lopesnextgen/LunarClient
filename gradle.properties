# Gradle daemon/build performance for the ~7.7k-file deobf tree.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Use the same JDKs as the Maven build (sdkman).
# JDK paths are resolved from the environment (JAVA_HOME / PATH); no
# user-specific paths are stored here.

# Only fetch dependencies when needed; most are already in ~/.m2.
org.gradle.internal.repository.max.tentatives=3
